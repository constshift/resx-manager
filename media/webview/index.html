<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src {{cspSource}} https: data:; style-src {{cspSource}} 'unsafe-inline'; script-src {{cspSource}};" />
	<title>Translation Scanner</title>
	<link rel="stylesheet" href="{{stylesheetUri}}" />
	<link rel="stylesheet" href="{{scannerStylesheetUri}}" />
	<link rel="stylesheet" href="{{fileViewStylesheetUri}}" />
	<link rel="stylesheet" href="{{translationStylesheetUri}}" />
</head>
<body>
	<div class="header">
		{{scannerHeaderHtml}}
		<div id="status" class="status"></div>
	</div>

	<div class="content">
		{{scannerSidebarHtml}}
		{{fileViewContentHtml}}
	</div>

	{{translationModalHtml}}

	<div id="loadingOverlay" class="loading-overlay"></div>

	<script src="{{scannerScriptUri}}"></script>
	<script src="{{fileViewScriptUri}}"></script>
	<script src="{{translationScriptUri}}"></script>
	<script src="{{scriptUri}}"></script>
</body>
</html>
